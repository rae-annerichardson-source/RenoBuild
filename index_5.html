<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House model — garage extension, terrace deck and upper floor</title>
<meta name="description" content="Interactive 3D model of a house with a two-car garage extension, terrace deck and built-out upper floor.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#EBEDEE;
  --dim:#8E979C;
  --line:#2A3034;
  --panel:rgba(17,21,23,0.88);
  --accent:#8FB6CE;
}

*{ box-sizing:border-box }

html, body{
  margin:0;
  height:100%;
  background:#0E1113;
  color:var(--ink);
  font-family:"Barlow", system-ui, -apple-system, sans-serif;
  overflow:hidden;
}

#view{ position:absolute; inset:0 }
canvas{ display:block }

#head{ position:absolute; left:20px; top:18px; pointer-events:none; max-width:50% }
#head h1{ margin:0; font-size:15px; font-weight:500 }
#head p{ margin:2px 0 0; font-size:12.5px; color:var(--dim) }

#bar{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  bottom:16px;
  display:flex;
  gap:5px;
  align-items:center;
  padding:7px;
  border-radius:11px;
  background:var(--panel);
  border:1px solid var(--line);
  backdrop-filter:blur(14px);
  max-width:calc(100% - 28px);
  flex-wrap:wrap;
  justify-content:center;
}

button, select{
  font:inherit;
  font-size:12.5px;
  color:var(--ink);
  background:transparent;
  border:1px solid transparent;
  border-radius:7px;
  padding:6px 10px;
  cursor:pointer;
}
select{ border-color:var(--line); background:#171B1E }
button:hover{ background:#1D2326 }
button.on{ color:#0E1113; background:var(--accent); border-color:var(--accent) }
button:focus-visible, select:focus-visible{ outline:2px solid var(--accent); outline-offset:2px }

.sep{ width:1px; height:20px; background:var(--line); margin:0 3px }

#meter{ position:absolute; right:20px; top:18px; text-align:right; font-size:12px; color:var(--dim) }
#bead{
  display:inline-block; width:7px; height:7px; border-radius:50%;
  background:var(--accent); margin-left:7px; vertical-align:middle;
}
#bead.done{ background:#3D4A50 }

#rose{
  position:absolute; right:20px; top:52px; width:62px; height:62px;
  border:1px solid var(--line); border-radius:50%; background:var(--panel);
}
#roseInner{ position:absolute; inset:0 }
#rose span{ position:absolute; font-size:10.5px; color:var(--dim) }
#nBar{
  position:absolute; left:50%; top:14px; margin-left:-4px; width:0; height:0;
  border-left:4px solid transparent; border-right:4px solid transparent;
  border-bottom:15px solid #B4574A;
}
#sBar{
  position:absolute; left:50%; bottom:14px; margin-left:-4px; width:0; height:0;
  border-left:4px solid transparent; border-right:4px solid transparent;
  border-top:15px solid #48545A;
}

#hint{
  position:absolute; left:20px; bottom:18px;
  font-size:12px; color:var(--dim); max-width:230px; line-height:1.55; display:none;
}

#msg{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  max-width:440px; padding:18px 20px; border-radius:10px;
  background:#171B1E; border:1px solid var(--line);
  font-size:13.5px; line-height:1.65;
}
#msg b{ font-weight:500 }
#msg code{ font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12.5px; color:var(--accent) }

@media (max-width:700px){
  #head{ left:14px; top:12px }
  #meter{ right:14px; top:12px }
  #rose{ display:none }
  #hint{ display:none !important }
  #bar{ bottom:10px; padding:6px }
  button, select{ padding:5px 8px; font-size:12px }
}
</style>
</head>
<body>

<div id="view"></div>

<div id="head">
  <h1>House model</h1>
  <p>Garage extension, terrace deck and upper floor</p>
</div>

<div id="meter"><span id="spp">Starting</span><span id="bead"></span></div>

<div id="rose">
  <div id="roseInner">
    <div id="nBar"></div>
    <div id="sBar"></div>
    <span style="left:50%;top:2px;margin-left:-3px">N</span>
    <span style="right:4px;top:50%;margin-top:-7px">E</span>
    <span style="left:50%;bottom:2px;margin-left:-3px">S</span>
    <span style="left:4px;top:50%;margin-top:-7px">W</span>
  </div>
</div>

<p id="hint">Drag to look around. W A S D or the arrow keys to move, Q and E for down and up, hold Shift to move faster.</p>

<div id="bar">
  <button id="mdOut" class="on">Outside</button>
  <button id="mdGnd">Ground floor</button>
  <button id="mdUp">Upper floor</button>
  <button id="mdWalk">Walk through</button>
  <span class="sep"></span>
  <select id="rooms" aria-label="Go to a room">
    <option value="">Go to a room…</option>
  </select>
  <span class="sep"></span>
  <button id="m1">Morning</button>
  <button id="m2" class="on">Midday</button>
  <button id="m3">Afternoon</button>
  <span class="sep"></span>
  <button id="save">Save image</button>
</div>

<div id="msg">Loading…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<!-- ==========================================================
     Building geometry. Metres, true scale, from the 1990
     drawings. X runs west to east, Z runs north from the road
     to the rear, Y is up. Origin at the plot's north-west corner.
     ========================================================== -->
<script>
/*
 * model.js — all building geometry for the house, garage extension and site.
 *
 * Exposes a single global, HouseModel, with:
 *   HouseModel.DIMS   plot dimensions in metres
 *   HouseModel.ROOMS  named camera stations, one per room
 *   HouseModel.build(THREE, renderer)  ->  { root, roofGroup, fillLights }
 *
 * Everything is modelled at true scale in metres, taken from the 1990
 * approved drawings: plot 17.68 x 28.52, house 9.55 wide x 14.8 deep,
 * front setback 4.5, west setback 3.35, east setback 4.78.
 *
 * Axes: X runs west to east, Z runs north (road) to south (rear), Y is up.
 */
(function (global) {
  'use strict';

  var PW = 17.68;   // plot width
  var PD = 28.52;   // original plot depth
  var RD = 9.00;    // amalgamated rear plot, indicative
  var TD = PD + RD; // total depth

  /* Camera stations: name, x, eye height, z, yaw */
  var ROOMS = [
    ['Front porch',         8.10, 1.65,  5.60, -0.10],
    ['Living room',         9.80, 1.65, 10.60,  0.30],
    ['Dining room',         5.10, 1.65, 12.30,  3.10],
    ['Sewing room',         5.10, 1.65,  9.10,  3.10],
    ['Kitchen',             5.10, 1.65, 15.30,  3.10],
    ['TV room',            11.10, 1.65, 15.20, -0.30],
    ['Guest room',         11.10, 1.65, 17.40, -0.30],
    ['Toilet and bath',     8.40, 1.65, 17.60,  3.14],
    ['Washroom',            5.20, 1.65, 17.60,  4.70],
    ['Garage',              8.30, 1.65, 23.40,  1.57],
    ['Garage WC + shower', 11.95, 1.65, 25.20,  3.14],
    ['Landing (upper)',     7.95, 4.85, 14.60,  3.14],
    ['Upstairs living',    10.40, 4.85, 15.20,  0.30],
    ['Servery',            11.80, 4.85, 17.90,  3.14],
    ['Loft reading nook',  11.80, 6.90, 16.00,  3.14],
    ['Master bedroom',      5.30, 4.85, 17.30,  3.14],
    ['Ensuite',             8.30, 4.85, 17.60,  3.14],
    ['Family bathroom',    10.00, 4.85, 17.90,  3.14],
    ['Bedroom 2',           5.00, 4.85, 14.30,  3.14],
    ['Terrace deck',        9.60, 4.85, 24.60, -0.10]
  ];

  function build(THREE, renderer) {

    var root = new THREE.Group();
    root.position.set(-PW / 2, 0, -TD / 2);

    var roofGroup = new THREE.Group();
    root.add(roofGroup);

    /* ---------------- helpers ---------------- */

    function S(hex, rough, metal, opacity) {
      var o = {
        color: hex,
        roughness: rough === undefined ? 0.9 : rough,
        metalness: metal || 0,
        side: THREE.DoubleSide
      };
      if (opacity !== undefined) { o.transparent = true; o.opacity = opacity; }
      var m = new THREE.MeshStandardMaterial(o);
      m.color.convertSRGBToLinear();
      m.clipShadows = true;
      return m;
    }

    /* Geometry cache: 850-odd boxes share a few dozen distinct sizes, so
       reusing them cuts memory sharply on modest GPUs. */
    var geoCache = {};
    function boxGeo(w, h, d) {
      var k = w.toFixed(3) + '|' + h.toFixed(3) + '|' + d.toFixed(3);
      if (!geoCache[k]) geoCache[k] = new THREE.BoxGeometry(w, h, d);
      return geoCache[k];
    }
    var planeCache = {};
    function planeGeo(w, d) {
      var k = 'p' + w.toFixed(3) + '|' + d.toFixed(3);
      if (!planeCache[k]) planeCache[k] = new THREE.PlaneGeometry(w, d);
      return planeCache[k];
    }

    function B(w, h, d, x, y, z, mat, parent, noShadow) {
      var e = new THREE.Mesh(boxGeo(w, h, d), mat);
      e.position.set(x, y, z);
      if (!noShadow) { e.castShadow = true; e.receiveShadow = true; }
      (parent || root).add(e);
      return e;
    }

    function FLAT(w, d, x, z, mat, y, parent) {
      var e = new THREE.Mesh(planeGeo(w, d), mat);
      e.rotation.x = -Math.PI / 2;
      e.position.set(x, y, z);
      e.receiveShadow = true;
      (parent || root).add(e);
      return e;
    }

    /* Wall running east-west, with optional door openings [[x1,x2], ...] */
    function wallX(x1, x2, z, h, base, mat, thick, gaps, doorH) {
      thick = thick || 0.15; doorH = doorH || 2.1; gaps = gaps || [];
      var pts = [x1], i;
      for (i = 0; i < gaps.length; i++) { pts.push(gaps[i][0], gaps[i][1]); }
      pts.push(x2);
      for (i = 0; i < pts.length; i += 2) {
        var a = pts[i], b = pts[i + 1];
        if (b - a > 0.01) B(b - a, h, thick, (a + b) / 2, base + h / 2, z, mat);
      }
      for (i = 0; i < gaps.length; i++) {
        var g = gaps[i], hh = h - doorH;
        if (hh > 0.02) B(g[1] - g[0], hh, thick, (g[0] + g[1]) / 2, base + doorH + hh / 2, z, mat);
      }
    }

    /* Wall running north-south, with optional door openings [[z1,z2], ...] */
    function wallZ(z1, z2, x, h, base, mat, thick, gaps, doorH) {
      thick = thick || 0.15; doorH = doorH || 2.1; gaps = gaps || [];
      var pts = [z1], i;
      for (i = 0; i < gaps.length; i++) { pts.push(gaps[i][0], gaps[i][1]); }
      pts.push(z2);
      for (i = 0; i < pts.length; i += 2) {
        var a = pts[i], b = pts[i + 1];
        if (b - a > 0.01) B(thick, h, b - a, x, base + h / 2, (a + b) / 2, mat);
      }
      for (i = 0; i < gaps.length; i++) {
        var g = gaps[i], hh = h - doorH;
        if (hh > 0.02) B(thick, hh, g[1] - g[0], x, base + doorH + hh / 2, (g[0] + g[1]) / 2, mat);
      }
    }

    /* ---------------- textures ---------------- */

    function paverTexture() {
      var c = document.createElement('canvas'); c.width = 512; c.height = 512;
      var x = c.getContext('2d');
      x.fillStyle = '#57544E'; x.fillRect(0, 0, 512, 512);
      var tones = ['#BAB5AB', '#C4BFB4', '#B0ABA1', '#BEB9AF', '#B5B0A6'];
      for (var r = 0; r < 8; r++) {
        var off = (r % 2) ? 64 : 0;
        for (var col = -1; col < 5; col++) {
          var px = col * 128 + off, py = r * 64;
          x.fillStyle = tones[(r * 3 + col + 10) % tones.length];
          x.fillRect(px + 4, py + 20, 120, 24);
          x.fillRect(px + 32, py + 4, 64, 56);
        }
      }
      var t = new THREE.CanvasTexture(c);
      t.encoding = THREE.sRGBEncoding;
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return t;
    }
    var PAVER = paverTexture();

    function paving(w, d, x, z, y) {
      var t = PAVER.clone(); t.needsUpdate = true;
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.repeat.set(w / 1.25, d / 1.25);
      var m = new THREE.MeshStandardMaterial({ map: t, roughness: 0.88 });
      m.clipShadows = true;
      return FLAT(w, d, x, z, m, y);
    }

    function tileTexture(base, joint, n) {
      var c = document.createElement('canvas'); c.width = 256; c.height = 256;
      var x = c.getContext('2d');
      x.fillStyle = joint; x.fillRect(0, 0, 256, 256);
      var s = 256 / n;
      for (var i = 0; i < n; i++) {
        for (var j = 0; j < n; j++) {
          x.fillStyle = base; x.fillRect(i * s + 2, j * s + 2, s - 4, s - 4);
        }
      }
      var t = new THREE.CanvasTexture(c);
      t.encoding = THREE.sRGBEncoding;
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      return t;
    }
    var TEX_TILE = tileTexture('#CFC7B8', '#A69E8E', 4);
    var TEX_WOOD = tileTexture('#9A6B3C', '#7A5227', 2);
    var TEX_WET  = tileTexture('#9FBCC8', '#7C97A2', 6);
    var TEX_UTIL = tileTexture('#A8AFA6', '#87907F', 5);

    function floorMat(tex, rep, rough) {
      var t = tex.clone(); t.needsUpdate = true;
      t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep, rep);
      var m = new THREE.MeshStandardMaterial({
        map: t, roughness: rough === undefined ? 0.55 : rough, side: THREE.DoubleSide
      });
      m.clipShadows = true;
      return m;
    }

    /* ---------------- materials ---------------- */

    var REN   = S(0xE9E2D3, 0.93),   // external render
        INT   = S(0xF0EBE0, 0.95),   // internal partitions
        PLIN  = S(0xC6BDAB, 0.95),   // plinth and bands
        MET   = S(0x4C5450, 0.40, 0.82),
        FAS   = S(0xF1ECE2, 0.80),
        GUT   = S(0xE8E4DA, 0.52, 0.28),
        GLS   = S(0x9CC0D4, 0.04, 0.0, 0.35),
        FRM   = S(0x32383A, 0.44, 0.22),
        DKM   = S(0x24282C, 0.38, 0.68),  // burglar proofing, railings
        TIMB  = S(0xA9773F, 0.82),        // deck boards
        TIMD  = S(0x7A5230, 0.85),        // loft platform
        GDOOR = S(0x7E858B, 0.36, 0.58),
        GPAN  = S(0x6E757B, 0.40, 0.50),
        CONCM = S(0xB4AFA5, 0.93),
        CAPM  = S(0xD9D3C5, 0.90),
        GRS   = S(0x5E9439, 1.0),
        GRS2  = S(0x6BA042, 1.0),
        GRAV  = S(0x7C766C, 0.98),
        FEN   = S(0x9AA0A2, 0.34, 0.78),
        TRK   = S(0x63503C, 0.95),
        LF    = S(0x37622C, 0.95),
        LF2   = S(0x477A35, 0.95),
        SAN   = S(0xF6F6F4, 0.28),
        CHR   = S(0xC8CDD0, 0.18, 0.90),
        CARB  = S(0x2A5F92, 0.24, 0.62),
        CARR  = S(0xA83A3A, 0.24, 0.62),
        TYRE  = S(0x1B1D1F, 0.92),
        LVRM  = S(0x93A8B4, 0.40, 0.50),
        DOORW = S(0x6A4A2E, 0.70),
        SOFA  = S(0x4E657A, 0.85),
        BEDL  = S(0xD6DEE6, 0.80),
        BEDF  = S(0x7E8F9E, 0.85),
        WOODF = S(0x8A6238, 0.60),
        KITC  = S(0x46604F, 0.40),
        KITT  = S(0x9EA6A8, 0.35),
        APPL  = S(0xB9BFC2, 0.28, 0.70);

    /* ---------------- site ---------------- */

    var ground = new THREE.Mesh(new THREE.PlaneGeometry(260, 260), GRS);
    ground.rotation.x = -Math.PI / 2;
    ground.position.set(PW / 2, -0.02, TD / 2);
    ground.receiveShadow = true;
    root.add(ground);
    FLAT(PW, RD, PW / 2, PD + RD / 2, GRS2, 0.005);

    // interlocking paver driveway, rear apron, side path, washroom landing
    paving(3.15, 19.3, 1.72,  9.65,  0.05);
    paving(6.15,  8.7, 3.22, 23.65,  0.05);
    paving(1.20, 15.5, 14.0, 12.00,  0.05);
    paving(1.50,  2.7, 2.45, 17.80,  0.07);

    // gravel drip strips under the front eaves, in place of gutters
    FLAT(0.55, 9.9,  2.70, 8.60, GRAV, 0.045);
    FLAT(0.55, 9.9, 13.55, 8.60, GRAV, 0.045);

    // boundary fencing
    B(0.06, 1.85, 37.5,  0.10, 0.92, 18.70, FEN);
    B(0.06, 1.85, 37.5, 17.58, 0.92, 18.70, FEN);
    B(17.5, 1.85, 0.06,  8.84, 0.92, 37.45, FEN);

    /* ---------------- ground floor slab and finishes ---------------- */

    FLAT(9.55, 12.6, 8.125, 13.00, CONCM, 0.02);
    FLAT(3.55, 3.0, 11.10, 17.80, floorMat(TEX_WOOD, 3), 0.03);  // guest room
    FLAT(3.55, 3.0, 11.10, 14.80, floorMat(TEX_WOOD, 3), 0.03);  // TV room
    FLAT(6.15, 6.1,  9.80, 10.25, floorMat(TEX_WOOD, 5), 0.03);  // living room
    FLAT(3.40, 3.0,  5.05, 14.80, floorMat(TEX_UTIL, 3), 0.03);  // kitchen
    FLAT(3.40, 3.0,  5.05, 17.80, floorMat(TEX_WET,  4), 0.03);  // washroom
    FLAT(1.75, 2.5,  8.40, 18.05, floorMat(TEX_WET,  3), 0.03);  // toilet and bath
    FLAT(3.30, 3.0,  5.02, 11.80, floorMat(TEX_TILE, 3), 0.03);  // dining
    FLAT(3.30, 3.1,  5.02,  8.75, floorMat(TEX_TILE, 3), 0.03);  // sewing
    FLAT(2.45, 3.5,  7.95, 15.05, floorMat(TEX_TILE, 3), 0.03);  // passage

    /* ---------------- ground floor external walls ---------------- */

    wallX(3.35, 12.90, 19.30, 3.2, 0, REN, 0.24, []);
    wallX(3.35, 12.90,  6.70, 3.2, 0, REN, 0.24, [[7.60, 8.60]], 2.15); // front door
    wallZ(6.70, 19.30, 12.90, 3.2, 0, REN, 0.24, []);
    wallZ(6.70, 16.58,  3.35, 3.2, 0, REN, 0.24, []);
    wallZ(19.02, 19.30, 3.35, 3.2, 0, REN, 0.24, []);

    // 8 ft washroom opening: columns each side, beam over, canopy
    B(0.30, 3.2, 0.30, 3.35, 1.60, 16.58, REN);
    B(0.30, 3.2, 0.30, 3.35, 1.60, 19.02, REN);
    B(0.28, 0.38, 2.44, 3.35, 2.79, 17.80, CONCM);
    B(0.24, 0.23, 2.44, 3.35, 3.10, 17.80, REN);
    B(0.34, 0.16, 2.95, 2.70, 3.28, 17.80, CONCM);

    B(9.85, 0.24, 0.32, 8.125, 3.30, 19.30, PLIN, null, true);
    B(9.85, 0.16, 0.32, 8.125, 0.22, 19.30, PLIN, null, true);
    B(0.32, 0.16, 12.85, 12.90, 0.22, 13.00, PLIN, null, true);
    B(0.32, 0.16,  9.90,  3.35, 0.22, 11.60, PLIN, null, true);

    /* ---------------- ground floor partitions ---------------- */

    wallX(9.30, 12.90, 16.30, 3.2, 0, INT, 0.14, [[10.00, 10.90]]);
    wallX(3.35,  6.80, 16.30, 3.2, 0, INT, 0.14, [[4.50, 5.40]]);
    wallZ(13.30, 19.30, 9.30, 3.2, 0, INT, 0.14, [[14.20, 15.10], [17.00, 17.90]]);
    wallZ(13.30, 19.30, 6.80, 3.2, 0, INT, 0.14, [[14.20, 15.10], [17.40, 18.30]]);
    wallX(6.80,  9.30, 16.80, 3.2, 0, INT, 0.14, [[7.80, 8.60]]);
    wallZ(16.80, 19.30, 7.50, 3.2, 0, INT, 0.14, []);
    wallX(6.80, 12.90, 13.30, 3.2, 0, INT, 0.14, [[9.60, 11.20]], 2.35);
    wallZ(7.20, 13.30,  6.70, 3.2, 0, INT, 0.14, [[10.80, 11.70]]);
    wallX(3.35,  6.70, 10.30, 3.2, 0, INT, 0.14, [[5.40, 6.30]]);

    /* ---------------- upper floor slab, with stair void ---------------- */

    B(4.20, 0.26, 6.54,  5.350, 3.07, 16.150, CONCM);
    B(4.37, 0.26, 6.54, 10.835, 3.07, 16.150, CONCM);
    B(1.20, 0.26, 0.47,  8.050, 3.07, 13.115, CONCM);
    B(1.20, 0.26, 3.32,  8.050, 3.07, 17.760, CONCM);

    FLAT(3.55, 4.35, 11.10, 15.17, floorMat(TEX_WOOD, 4), 3.215); // upper living
    FLAT(2.20, 1.95, 11.80, 18.32, floorMat(TEX_TILE, 2), 3.215); // servery
    FLAT(3.95, 3.00,  5.32, 17.80, floorMat(TEX_WOOD, 3), 3.215); // master
    FLAT(3.25, 3.30,  4.97, 14.65, floorMat(TEX_WOOD, 3), 3.215); // bedroom 2
    FLAT(2.00, 2.50,  8.30, 18.05, floorMat(TEX_WET,  3), 3.215); // ensuite
    FLAT(1.40, 1.95, 10.00, 18.32, floorMat(TEX_WET,  3), 3.215); // family bath

<script>
/*
 * viewer.js — renderer, lighting, camera modes and UI.
 *
 * Every optional subsystem degrades rather than failing: no environment map,
 * no float buffers, no clipping planes, and the viewer still runs. If setup
 * does fail hard, the banner names the phase it failed in and prints the
 * message and the top of the stack, so the fault can be pinned down without
 * opening the console.
 */
(function () {
  'use strict';

  var msg = document.getElementById('msg');
  var phase = 'startup';

  function show(html) { msg.style.display = 'block'; msg.innerHTML = html; }
  function hide() { msg.style.display = 'none'; }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  if (typeof THREE === 'undefined') {
    show('<b>Could not load three.js.</b><br>This page needs internet access the first ' +
         'time it runs, and some networks block <code>cdnjs.cloudflare.com</code>.');
    return;
  }

    start();
  } catch (err) {
    if (!err || err.message !== '__handled__') {
      var line = '';
      if (err && err.stack) {
        var parts = err.stack.split('\n');
        line = '<br><code>' + esc((parts[1] || '').trim()) + '</code>';
      }

           esc(err && err.message ? err.message : err) + '</code>' + line +
           '<br><br>Send me that line and I can fix it.');

function start() {

  var DIMS = HouseModel.DIMS;
  var PW = DIMS.PW, TD = DIMS.TD;

  /* ---------------- renderer ---------------- */

  phase = 'creating the WebGL renderer';
  var renderer;

  } catch (e) {

  /* ---------------- sky and image based lighting ---------------- */

  phase = 'building the sky';
  function skyTexture() {
    var c = document.createElement('canvas'); c.width = 2048; c.height = 1024;
    var x = c.getContext('2d');

  phase = 'placing the lights';
  var hemi = new THREE.HemisphereLight(0xBFD8EA, 0x4E6B33, 0.50);

  var sun = new THREE.DirectionalLight(0xFFF3DE, 2.5);

  sun.shadow.mapSize.width = 2048;
  sun.shadow.mapSize.height = 2048;
  var sc = sun.shadow.camera;
  sc.left = -28; sc.right = 28; sc.top = 28; sc.bottom = -28; sc.near = 1; sc.far = 180;
  sun.shadow.bias = -0.0004;
  sun.shadow.normalBias = 0.022;

  scene.add(new THREE.AmbientLight(0xffffff, 0.16));

  /* ---------------- the building ---------------- */

  phase = 'building the geometry';

  scene.add(model.root);
  var i;
  for (i = 0; i < model.fillLights.length; i++) scene.add(model.fillLights[i]);

  /* ---------------- room list ---------------- */

  phase = 'filling the room list';
  var ROOMS = HouseModel.ROOMS;
  var sel = document.getElementById('rooms');

  /* ---------------- camera modes ---------------- */

  phase = 'setting up the camera';
  var mode = 'out';
  var target = new THREE.Vector3(8.6 - PW / 2, 3.0, 15.5 - TD / 2);
  var theta = -0.86, phi = 1.04, radius = 46;
  var walkPos = new THREE.Vector3(8.10 - PW / 2, 1.65, 5.60 - TD / 2);
  var walkYaw = -0.10, walkPitch = 0;

  var clipGround = new THREE.Plane(new THREE.Vector3(0, -1, 0), 2.25);
  var clipUpperTop = new THREE.Plane(new THREE.Vector3(0, -1, 0), 5.55);
  var clipUpperBot = new THREE.Plane(new THREE.Vector3(0, 1, 0), -3.15);

  var MODE_BUTTONS = { out: 'mdOut', gnd: 'mdGnd', up: 'mdUp', walk: 'mdWalk' };

  function applyMode() {

    camera.fov = (mode === 'walk') ? 68 : 40;
    camera.updateProjectionMatrix();
    var hint = document.getElementById('hint');
    if (hint) hint.style.display = (mode === 'walk') ? 'block' : 'none';
    for (var k in MODE_BUTTONS) {

        var b = document.getElementById(MODE_BUTTONS[k]);
        if (b) b.classList.toggle('on', k === mode);

    updateCamera();
  }

  function updateCamera() {
    if (mode === 'walk') {
      camera.position.copy(walkPos);
      var dir = new THREE.Vector3(
        Math.sin(walkYaw) * Math.cos(walkPitch),
        Math.sin(walkPitch),
        Math.cos(walkYaw) * Math.cos(walkPitch)

      camera.lookAt(walkPos.x + dir.x, walkPos.y + dir.y, walkPos.z + dir.z);
    } else {
      camera.position.set(
        target.x + radius * Math.sin(phi) * Math.sin(theta),
        target.y + radius * Math.cos(phi),
        target.z + radius * Math.sin(phi) * Math.cos(theta)

    updateRose();
    resetAccumulation();
  }

  function goToRoom(index) {
    var r = ROOMS[index];
    walkPos.set(r[1] - PW / 2, r[2], r[3] - TD / 2);
    walkYaw = r[4];
    walkPitch = -0.04;
    mode = 'walk';
    applyMode();

  sel.addEventListener('change', function () {
    if (sel.value !== '') { goToRoom(parseInt(sel.value, 10)); sel.value = ''; }
  });

  var dragging = false, lastX = 0, lastY = 0;
  var el = renderer.domElement;

  function pointerDown(x, y) { dragging = true; lastX = x; lastY = y; }

      phi -= dy * 0.004;

  el.addEventListener('touchmove', function (e) {

  var keys = {};
  window.addEventListener('keydown', function (e) {
    if (!e.key) return;

  window.addEventListener('keyup', function (e) {

    if (keys.w || keys.arrowup) fwd += 1;
    if (keys.s || keys.arrowdown) fwd -= 1;
    if (keys.a || keys.arrowleft) side -= 1;
    if (keys.d || keys.arrowright) side += 1;

      '}',

  phase = 'positioning the sun';
  var SUNS = {
    m1: { pos: [ 44, 22, 28], color: 0xFFDCAA, intensity: 2.1, hemi: 0.42 },
    m2: { pos: [ 12, 60, 22], color: 0xFFF6EA, intensity: 2.6, hemi: 0.52 },
    m3: { pos: [-42, 20, 10], color: 0xFFC58A, intensity: 2.0, hemi: 0.40 }

  var sunKey = 'm2';

  function applySun() {
    var s = SUNS[sunKey];

      if (b) b.classList.toggle('on', id === sunKey);
    });
    resetAccumulation();
  }

  applySun();
  applyMode();

  /* ---------------- render loop ---------------- */

  phase = 'starting the render loop';
  var counter = document.getElementById('spp');
  var bead = document.getElementById('bead');

  function loop() {
    requestAnimationFrame(loop);
    try {
      stepWalk();

      if (!accumulationWorks) {
        var p = SUNS[sunKey].pos;
        sun.position.set(p[0], p[1], p[2]);
        renderer.setRenderTarget(null);
        renderer.render(scene, camera);
        if (counter) counter.textContent = 'Live';
        return;
      }

      if (frame >= MAX_SAMPLES) {
        renderer.setRenderTarget(null);
        outMat.uniforms.tAcc.value = (front === 0 ? rtA : rtB).texture;
        renderer.render(outScene, quadCam);
        return;
      }

      var base = SUNS[sunKey].pos;
      sun.position.set(
        base[0] + (Math.random() - 0.5) * SUN_SOFTNESS * 2,
        base[1] + (Math.random() - 0.5) * SUN_SOFTNESS,
        base[2] + (Math.random() - 0.5) * SUN_SOFTNESS * 2
      );
      camera.setViewOffset(
        window.innerWidth, window.innerHeight,
        (Math.random() - 0.5), (Math.random() - 0.5),
        window.innerWidth, window.innerHeight
      );

      renderer.setRenderTarget(rtSample);
      renderer.render(scene, camera);

      var prev = (front === 0) ? rtA : rtB;
      var next = (front === 0) ? rtB : rtA;
      blendMat.uniforms.tCur.value = rtSample.texture;
      blendMat.uniforms.tPrev.value = prev.texture;
      blendMat.uniforms.uW.value = 1 / (frame + 1);
      renderer.setRenderTarget(next);
      renderer.render(blendScene, quadCam);

      renderer.setRenderTarget(null);
      outMat.uniforms.tAcc.value = next.texture;
      renderer.render(outScene, quadCam);

      front = 1 - front;
      frame++;
      camera.clearViewOffset();

      if (counter) {
        counter.textContent = (frame >= MAX_SAMPLES)
          ? 'Refined'
          : ('Refining ' + frame + '/' + MAX_SAMPLES);
      }
      if (bead) bead.classList.toggle('done', frame >= MAX_SAMPLES);

    } catch (e) {
      // Drop the refinement path and keep drawing rather than freezing.
      console.warn('Refinement failed, falling back to live rendering.', e);
      camera.clearViewOffset();
      liveMode();
      renderer.setRenderTarget(null);
    }
  }
  loop();

  /* ---------------- buttons ---------------- */

  phase = 'attaching the buttons';
  function on(id, fn) {
    var b = document.getElementById(id);
    if (b) b.addEventListener('click', fn);
  }
  on('mdOut', function () {
    mode = 'out'; theta = -0.86; phi = 1.04; radius = 46;
    target.set(8.6 - PW / 2, 3.0, 15.5 - TD / 2);
    applyMode();
  });
  on('mdGnd', function () {
    mode = 'gnd'; theta = -0.80; phi = 0.42; radius = 34;
    target.set(8.1 - PW / 2, 1.2, 13.5 - TD / 2);
    applyMode();
  });
  on('mdUp', function () {
    mode = 'up'; theta = -0.80; phi = 0.40; radius = 30;
    target.set(8.1 - PW / 2, 3.6, 16.2 - TD / 2);
    applyMode();
  });
  on('mdWalk', function () { goToRoom(0); });
  on('m1', function () { sunKey = 'm1'; applySun(); });
  on('m2', function () { sunKey = 'm2'; applySun(); });
  on('m3', function () { sunKey = 'm3'; applySun(); });
  on('save', function () {
    try {
      var a = document.createElement('a');
      a.download = 'house-view.png';
      a.href = renderer.domElement.toDataURL('image/png');
      a.click();
    } catch (e) { console.warn('Could not save the image.', e); }
  });

  window.addEventListener('resize', function () {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    makeTargets();
    updateCamera();
  });

  phase = 'running';
}
})();
</script>

</body>
</html>
